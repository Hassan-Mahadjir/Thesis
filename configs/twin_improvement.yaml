input:
  assignments_csv: "data/splits/usable_with_split_assignments.csv"
  protocols_dir: "data/protocols"

output:
  features_dir: "data/features"
  scores_dir: "reports/baselines/scores"
  checkpoints_dir: "checkpoints/twin_aware"
  training_reports_dir: "reports/training/twin_aware_facenet_frontal"
  calibration_dir: "reports/calibration/twin_aware_facenet_frontal"

columns:
  image_id: "image_id"
  subject_id: "subject_id"
  family_id: "family_group_id"
  monozygotic_group_id: "monozygotic_group_id"
  split: "split"
  fold: "fold"

twin_aware_facenet:
  pretrained: "vggface2"
  image_column: "aligned_112_arcface_path"
  image_size: 160

  seed: 42
  validation_fold: 4

  # Frontal-first training set. These manifests are unioned and de-duplicated.
  training_protocols:
    - "p0_controlled_neutral_frontal"
    - "p1_controlled_expression"
    - "p2_frontal_illumination"

  # Used only during hyperparameter tuning/model selection.
  validation_protocols:
    p0_controlled_neutral_frontal: 0.40
    p1_controlled_expression: 0.20
    p2_frontal_illumination: 0.20
    p3_frontal_all: 0.20

  batch_size: 32
  evaluation_batch_size: 128
  num_workers: 4

  epochs: 20

  # IMPORTANT:
  # Set BOTH of these to the best_epoch already selected on DEVELOPMENT.
  # OOF folds must use a fixed epoch count; do not early-stop on the held-out fold.
  final_epochs: 10
  oof_fixed_epochs: 10

  learning_rate: 0.00003
  weight_decay: 0.0001

  unfreeze_modules:
    - "block8"
    - "last_linear"
    - "last_bn"

  twin_margin: 0.15
  unrelated_margin: 0.50

  twin_loss_weight: 1.00
  unrelated_loss_weight: 0.50
  positive_compactness_weight: 0.20
  preserve_pretrained_weight: 0.20

  max_genuine_pairs_per_subject: 50
  max_cotwin_pairs_per_subject_pair: 100

  early_stopping_patience: 5
  objective_min_delta: 0.0001

  checkpoint_name: "twin_aware_facenet_frontal_best.pt"
  final_checkpoint_name: "twin_aware_facenet_frontal_final.pt"

  oof:
    folds: [1, 2, 3, 4]
    checkpoints_subdir: "oof"
    features_name: "twin_aware_facenet_frontal_oof"
    thresholds_file: "oof_thresholds.json"
    seed: 42
